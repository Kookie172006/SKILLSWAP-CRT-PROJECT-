<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | SkillSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body class="bg-light-purple">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="images/icon.png" alt="SkillSwap logo" class="logo-image logo-image-navbar">
            <span class="logo-word">SkillSwap</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="skills.html">My Skills</a>
            <a href="search.html">Explore</a>
            <a href="requests.html">Requests</a>
            <a href="sessions.html">Sessions</a>
        </div>
        <div class="nav-actions">
            <a href="profile.html" class="btn btn-outline">My Profile</a>
        </div>
    </nav>


    <!-- Chat Interface -->
    <main class="chat-container">
        <div class="chat-wrapper">
           
            <!-- Left Sidebar: Conversations -->
            <aside class="chat-sidebar">
                <div class="sidebar-header">
                    <h2>Messages</h2>
                    <span id="chatCount">0 chats</span>
                </div>
                <div class="search-bar">
                    <input type="text" id="chatSearch" placeholder="🔍 Find a conversation...">
                </div>
                <div class="conversation-list" id="conversationList">
                    <!-- Conversations loaded here dynamically -->
                </div>
            </aside>


            <!-- Right Panel: Chat Area -->
            <section class="chat-main">
               
                <!-- Empty State (Shown when no chat is selected) -->
                <div class="chat-empty-state" id="emptyChatState">
                    <div class="empty-icon">💌</div>
                    <h2>Your next great conversation<br>starts here.</h2>
                    <p>Select a conversation from the left to start chatting.</p>
                </div>


                <!-- Active Chat State (Hidden by default) -->
                <div class="chat-active-state" id="activeChatState" hidden>
                   
                    <!-- Chat Header -->
                    <header class="chat-header">
                        <div class="chat-user-info">
                            <div class="avatar" id="activeAvatar">U</div>
                            <div class="details">
                                <h3 id="activeName">User Name</h3>
                                <p id="activeSkill">Skill exchange</p>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline btn-small" id="scheduleBtn">📅 Schedule Session</button>
                    </header>


                    <!-- Messages Window -->
                    <div class="chat-messages" id="chatMessages">
                        <!-- Message bubbles loaded here -->
                    </div>


                    <!-- Input Area -->
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off">
                        <button id="sendBtn" class="send-btn" aria-label="Send message">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="white">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
               
            </section>
        </div>
    </main>


    <!-- Added ?v=3 to force the browser to forget the old broken cache -->
    <script src="js/messages.js?v=3"></script>
</body>
</html>
